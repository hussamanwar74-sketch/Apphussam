<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>تطبيقات Tva</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        body { background-color: #0d0f12; color: #ffffff; padding: 15px; }
        
        .search-box { width: 100%; max-width: 500px; margin: 10px auto 20px; position: relative; }
        .search-box input { width: 100%; padding: 12px 20px; background: #161b22; border: 1px solid #30363d; border-radius: 8px; color: #fff; font-size: 15px; outline: none; }

        .categories { display: flex; gap: 8px; overflow-x: auto; padding-bottom: 15px; max-width: 500px; margin: 0 auto; }
        .cat-btn { background: #161b22; border: 1px solid #30363d; color: #c9d1d9; padding: 8px 16px; border-radius: 8px; font-size: 14px; white-space: nowrap; cursor: pointer; }
        .cat-btn.active { background: #00c853; color: #000; font-weight: bold; border-color: #00c853; }

        .app-card { background: #161b22; border: 1px solid #21262d; border-radius: 12px; padding: 15px; margin: 15px auto; max-width: 500px; }
        .app-header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 8px; }
        .app-title { font-size: 18px; font-weight: bold; }
        .app-version { background: #1f6feb22; color: #58a6ff; font-size: 12px; padding: 3px 8px; border-radius: 6px; border: 1px solid #1f6feb44; }
        .app-category { color: #8b949e; font-size: 13px; margin-bottom: 15px; }

        .download-btn { display: flex; align-items: center; justify-content: center; gap: 8px; background: #00c853; color: #000; text-decoration: none; font-weight: bold; padding: 12px; border-radius: 8px; text-align: center; font-size: 16px; width: 100%; transition: 0.2s; }
        .download-btn:hover { background: #00e676; }
    </style>
</head>
<body>

    <div class="search-box">
        <input type="text" placeholder="ابحث عن تطبيق...">
    </div>

    <div class="categories">
        <button class="cat-btn active">الكل</button>
        <button class="cat-btn">رياضة</button>
        <button class="cat-btn">سينما</button>
        <button class="cat-btn">IPTV</button>
        <button class="cat-btn">أدوات</button>
    </div>

    <div class="app-card">
        <div class="app-header">
            <span class="app-title">1 IRAQ TV</span>
            <span class="app-version">v 5</span>
        </div>
        <div class="app-category">رياضة</div>
        <a href="1_IRAQ_TV_v1.apk" class="download-btn">↓ تحميل</a>

    <div class="app-card">
        <div class="app-header">
            <span class="app-title">Cinemana 4K</span>
            <span class="app-version">v 4.5.10</span>
        </div>
        <div class="app-category">العراق</div>
        <a href="#" class="download-btn">⬇ تحميل</a>
    </div>

</body>
</html>
